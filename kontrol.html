<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrol Presentasi - By Buana Media</title>

  <!-- Google Font Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- File Konfigurasi Firebase External -->
  <script src="js/firebase-config.js"></script>

  <style>
    body {
      font-family: 'Poppins', 'Inter', sans-serif;
      background-color: #0b1120;
      color: #f1f5f9;
      user-select: none;
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex justify-center items-start">

  <div class="w-full max-w-md bg-[#0f172a] border border-slate-800/80 rounded-3xl p-6 shadow-2xl relative">
    
    <!-- PENCARIAN & TAMBAH -->
    <div class="mb-4">
      <input type="text" id="search-input" onkeyup="filterPresentations()" placeholder="Cari Presentasi..." class="w-full bg-[#1e293b]/60 border border-slate-700/60 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition-all">
    </div>

    <button onclick="bukaModalTambah()" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center transition-all shadow-md active:scale-95 mb-4">
      <i class="fa-solid fa-plus text-sm"></i>
    </button>

    <!-- LIST PILIHAN PRESENTASI DARI FIREBASE -->
    <div id="presentation-list" class="space-y-3 mb-6 max-h-48 overflow-y-auto pr-1">
      <div class="text-xs text-slate-500 italic text-center py-2">Memuat data presentasi...</div>
    </div>

    <!-- INFORMASI PRESENTASI AKTIF -->
    <div class="bg-[#182238]/80 border border-slate-800 rounded-2xl p-4 mb-5">
      <h2 class="text-sm font-bold text-white mb-2">Kontrol Presentasi</h2>
      <p class="text-xs text-slate-300 font-medium">Judul: <span id="active-title" class="text-white font-bold">-</span></p>
      <p class="text-xs text-slate-400 font-medium mt-0.5 mb-4">Pembicara: <span id="active-speaker" class="text-slate-300">-</span></p>

      <div class="flex gap-2">
        <button onclick="bukaModalAturSlide()" class="flex-1 bg-[#0b1120] hover:bg-slate-800 text-slate-200 border border-slate-700/80 font-semibold text-xs py-2.5 rounded-xl transition-all shadow">
          Atur Slide
        </button>
        <button onclick="hapusPresentasiAktif()" class="bg-red-950/60 hover:bg-red-900 border border-red-800/60 text-red-400 px-3 py-2.5 rounded-xl transition-all shadow active:scale-95">
          <i class="fa-solid fa-trash-can text-xs"></i>
        </button>
      </div>
    </div>

    <!-- TARGET LAYAR -->
    <div class="mb-5">
      <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2.5">TAMPIL DI LAYAR:</label>
      <div class="flex flex-wrap gap-4 text-xs font-semibold text-slate-300">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="target-stream" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer"> Live Streaming
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="target-audiens" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer"> Monitor Audiens
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="target-stage" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer"> Monitor Stage
        </label>
      </div>
    </div>

    <!-- 4 TOMBOL KONTROL UTAMA -->
    <div class="grid grid-cols-4 gap-2 mb-6">
      <!-- BALIK -->
      <button onclick="prevSlide()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-1 transition-all active:scale-95 shadow-md">
        &lt; Balik
      </button>

      <!-- SEMBUNYIKAN -->
      <button onclick="sembunyikanOverlay()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-1 transition-all active:scale-95 shadow-md">
        <i class="fa-solid fa-eye-slash text-[11px]"></i> Sembunyikan
      </button>

      <!-- TAMPILKAN -->
      <button onclick="tampilkanOverlay()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-1 transition-all active:scale-95 shadow-md">
        <i class="fa-solid fa-eye text-[11px]"></i> Tampilkan
      </button>

      <!-- BERIKUT -->
      <button onclick="nextSlide()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-1 transition-all active:scale-95 shadow-md">
        Berikut &gt;
      </button>
    </div>

    <!-- DAFTAR SLIDE AKTIF (THUMBNAILS) -->
    <div class="mb-2">
      <p class="text-xs font-semibold text-slate-400 mb-3">Daftar Slide (Klik untuk menampilkan langsung)</p>
      <div id="slide-thumbnails" class="flex gap-3 overflow-x-auto pb-2 min-h-[90px]">
        <!-- Render otomatis via JS -->
      </div>
    </div>

    <!-- FOOTER -->
    <div class="mt-6 pt-4 border-t border-slate-800/80 text-center text-[11px] text-slate-500 font-medium">
      Panel Kontrol OBS © By Buana Media
    </div>

  </div>

  <!-- MODAL: TAMBAH PRESENTASI BARU -->
  <div id="modal-tambah" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#0f172a] border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <h3 class="text-sm font-bold text-white mb-4">Tambah Presentasi Baru</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Judul Presentasi</label>
          <input type="text" id="new-title" class="w-full bg-[#1e293b] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Speaker / Pembicara</label>
          <input type="text" id="new-speaker" class="w-full bg-[#1e293b] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button onclick="tutupModalTambah()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2 rounded-xl">Batal</button>
        <button onclick="simpanPresentasiBaru()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-xl">Simpan</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ATUR SLIDE -->
  <div id="modal-slide" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#0f172a] border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
        <h3 class="text-sm font-bold text-white">Kelola Slide Presentasi</h3>
        <button onclick="tambahSlideBaru()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3 py-1.5 rounded-lg">
          + Slide
        </button>
      </div>

      <div id="modal-slide-list" class="space-y-3 overflow-y-auto pr-1 flex-1">
        <!-- Render form slide -->
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-3 border-t border-slate-800">
        <button onclick="tutupModalAturSlide()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2 rounded-xl">Selesai</button>
      </div>
    </div>
  </div>

  <script>
    let presentationsData = {};
    let activePresId = null;
    let currentSlideIndex = 0;

    // SINKRONISASI DATABSE FIREBASE REALTIME
    if (typeof database !== 'undefined') {
      
      // 1. Dengar Perubahan Daftar Presentasi
      database.ref('presentations').on('value', (snapshot) => {
        presentationsData = snapshot.val() || {};
        renderPresentationList();

        // Pilih presentasi pertama jika belum ada yang terpilih
        if (!activePresId && Object.keys(presentationsData).length > 0) {
          activePresId = Object.keys(presentationsData)[0];
        }
        renderActivePresentation();
      });

      // 2. Dengar Perubahan Status Active Overlay dari Utama/OBS
      database.ref('activeOverlay').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && data.type === 'presentasi' && data.slide) {
          // Lacak slide index saat ini jika diubah dari luar
          if (presentationsData[activePresId] && presentationsData[activePresId].slides) {
            const idx = presentationsData[activePresId].slides.findIndex(s => s.text === data.slide.text && s.img === data.slide.img);
            if (idx !== -1) {
              currentSlideIndex = idx;
              renderThumbnails();
            }
          }
        }
      });
    }

    // RENDER LIST PRESENTASI (PILIHAN)
    function renderPresentationList(filter = '') {
      const container = document.getElementById('presentation-list');
      container.innerHTML = '';

      const keys = Object.keys(presentationsData);
      if (keys.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-500 italic text-center py-2">Belum ada presentasi. Klik '+' untuk membuat.</div>`;
        return;
      }

      keys.forEach(id => {
        const item = presentationsData[id];
        const judul = item.title || item.judul || 'Tanpa Judul';
        const speaker = item.speaker || item.pembicara || '-';

        if (filter && !judul.toLowerCase().includes(filter.toLowerCase()) && !speaker.toLowerCase().includes(filter.toLowerCase())) {
          return;
        }

        const isSelected = id === activePresId;
        const card = document.createElement('div');
        card.className = `p-3 rounded-2xl border transition-all cursor-pointer ${
          isSelected 
            ? 'bg-[#182238] border-indigo-600/80 ring-1 ring-indigo-500/50' 
            : 'bg-[#131b2e]/60 border-slate-800/80 hover:border-slate-700'
        }`;

        card.onclick = () => pilihPresentasi(id);

        card.innerHTML = `
          <h4 class="text-xs font-bold text-white truncate">${judul}</h4>
          <p class="text-[11px] text-slate-400 font-medium mt-0.5">Speaker: ${speaker}</p>
        `;

        container.appendChild(card);
      });
    }

    function filterPresentations() {
      const query = document.getElementById('search-input').value;
      renderPresentationList(query);
    }

    // PILIH PRESENTASI
    function pilihPresentasi(id) {
      activePresId = id;
      currentSlideIndex = 0;
      renderPresentationList(document.getElementById('search-input').value);
      renderActivePresentation();
      tampilkanOverlay();
    }

    // RENDER PRESENTASI AKTIF & THUMBNAILS SLIDE
    function renderActivePresentation() {
      if (!activePresId || !presentationsData[activePresId]) {
        document.getElementById('active-title').innerText = '-';
        document.getElementById('active-speaker').innerText = '-';
        document.getElementById('slide-thumbnails').innerHTML = '';
        return;
      }

      const activeObj = presentationsData[activePresId];
      document.getElementById('active-title').innerText = activeObj.title || activeObj.judul || '-';
      document.getElementById('active-speaker').innerText = activeObj.speaker || activeObj.pembicara || '-';

      renderThumbnails();
    }

    function renderThumbnails() {
      const container = document.getElementById('slide-thumbnails');
      container.innerHTML = '';

      if (!activePresId || !presentationsData[activePresId]) return;

      const slides = presentationsData[activePresId].slides || [];

      slides.forEach((slide, index) => {
        const isActive = index === currentSlideIndex;
        const thumb = document.createElement('div');
        thumb.className = `shrink-0 w-28 h-20 rounded-xl p-2 border transition-all cursor-pointer flex flex-col justify-between relative overflow-hidden ${
          isActive 
            ? 'bg-indigo-900/60 border-indigo-500 ring-2 ring-indigo-500/50' 
            : 'bg-slate-800/50 border-slate-700/60 hover:border-slate-500'
        }`;

        thumb.onclick = () => {
          currentSlideIndex = index;
          renderThumbnails();
          tampilkanOverlay();
        };

        if (slide.img) {
          thumb.style.backgroundImage = `linear-gradient(to bottom, rgba(15,23,42,0.6), rgba(15,23,42,0.9)), url('${slide.img}')`;
          thumb.style.backgroundSize = 'cover';
          thumb.style.backgroundPosition = 'center';
        }

        thumb.innerHTML = `
          <span class="text-[9px] font-bold uppercase bg-slate-900/80 px-1.5 py-0.5 rounded text-indigo-400 w-fit">Slide ${index + 1}</span>
          <p class="text-[10px] font-medium text-white truncate">${slide.text || ''}</p>
        `;

        container.appendChild(thumb);
      });
    }

    // KIRIM PERINDAH KE FIREBASE OVERLAY
    function getSelectedTargets() {
      return {
        stream: document.getElementById('target-stream').checked,
        audiens: document.getElementById('target-audiens').checked,
        stage: document.getElementById('target-stage').checked
      };
    }

    function updateOverlayFirebase(actionType = 'show') {
      if (typeof database === 'undefined' || !activePresId || !presentationsData[activePresId]) return;

      const slides = presentationsData[activePresId].slides || [];
      const activeSlide = slides[currentSlideIndex] || { text: '', img: '' };

      database.ref('activeOverlay').set({
        action: actionType,
        type: 'presentasi',
        targets: getSelectedTargets(),
        slide: {
          text: activeSlide.text || '',
          img: activeSlide.img || ''
        },
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    // LOGIKA NAVIGASI TOMBOL (BALIK - TAMPILKAN - SEMBUNYIKAN - BERIKUT)
    function prevSlide() {
      if (!activePresId || !presentationsData[activePresId]) return;
      const slides = presentationsData[activePresId].slides || [];
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderThumbnails();
        tampilkanOverlay();
      }
    }

    function nextSlide() {
      if (!activePresId || !presentationsData[activePresId]) return;
      const slides = presentationsData[activePresId].slides || [];
      if (currentSlideIndex < slides.length - 1) {
        currentSlideIndex++;
        renderThumbnails();
        tampilkanOverlay();
      }
    }

    function tampilkanOverlay() {
      updateOverlayFirebase('show');
    }

    function sembunyikanOverlay() {
      if (typeof database !== 'undefined') {
        database.ref('activeOverlay').update({
          action: 'hide'
        });
      }
    }

    // KELOLA PRESENTASI (TAMBAH / HAPUS)
    function bukaModalTambah() {
      document.getElementById('new-title').value = '';
      document.getElementById('new-speaker').value = '';
      document.getElementById('modal-tambah').classList.remove('hidden');
    }

    function tutupModalTambah() {
      document.getElementById('modal-tambah').classList.add('hidden');
    }

    function simpanPresentasiBaru() {
      const title = document.getElementById('new-title').value.trim();
      const speaker = document.getElementById('new-speaker').value.trim();

      if (!title) {
        alert('Judul tidak boleh kosong!');
        return;
      }

      if (typeof database !== 'undefined') {
        const newRef = database.ref('presentations').push();
        newRef.set({
          title: title,
          speaker: speaker,
          slides: [{ text: title, img: '' }]
        }).then(() => {
          activePresId = newRef.key;
          tutupModalTambah();
        });
      }
    }

    function hapusPresentasiAktif() {
      if (!activePresId) return;
      if (confirm('Yakin ingin menghapus presentasi ini dari database?')) {
        database.ref(`presentations/${activePresId}`).remove().then(() => {
          activePresId = null;
          currentSlideIndex = 0;
          sembunyikanOverlay();
        });
      }
    }

    // KELOLA SLIDE PRESENTASI
    function bukaModalAturSlide() {
      if (!activePresId || !presentationsData[activePresId]) return;
      renderModalSlideList();
      document.getElementById('modal-slide').classList.remove('hidden');
    }

    function tutupModalAturSlide() {
      document.getElementById('modal-slide').classList.add('hidden');
      if (activePresId) {
        database.ref(`presentations/${activePresId}/slides`).set(presentationsData[activePresId].slides);
      }
      renderThumbnails();
    }

    function renderModalSlideList() {
      const listContainer = document.getElementById('modal-slide-list');
      listContainer.innerHTML = '';

      const slides = presentationsData[activePresId].slides || [];

      slides.forEach((slide, index) => {
        const item = document.createElement('div');
        item.className = "bg-[#182238] border border-slate-800 p-3 rounded-xl flex flex-col gap-2 relative";
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-indigo-400">Slide ${index + 1}</span>
            <button onclick="hapusSlide(${index})" class="text-red-400 hover:text-red-300 text-xs">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
          <input type="text" placeholder="Teks Slide..." value="${slide.text || ''}" onchange="updateSlideInMemory(${index}, 'text', this.value)" class="bg-[#0b1120] border border-slate-700/70 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
          <input type="text" placeholder="URL Gambar (Opsional)..." value="${slide.img || ''}" onchange="updateSlideInMemory(${index}, 'img', this.value)" class="bg-[#0b1120] border border-slate-700/70 rounded-lg px-3 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
        `;
        listContainer.appendChild(item);
      });
    }

    function updateSlideInMemory(index, key, val) {
      if (presentationsData[activePresId].slides[index]) {
        presentationsData[activePresId].slides[index][key] = val;
      }
    }

    function tambahSlideBaru() {
      if (!presentationsData[activePresId].slides) {
        presentationsData[activePresId].slides = [];
      }
      presentationsData[activePresId].slides.push({ text: '', img: '' });
      renderModalSlideList();
    }

    function hapusSlide(index) {
      if (presentationsData[activePresId].slides.length <= 1) {
        alert('Minimal harus ada 1 slide!');
        return;
      }
      presentationsData[activePresId].slides.splice(index, 1);
      if (currentSlideIndex >= presentationsData[activePresId].slides.length) {
        currentSlideIndex = presentationsData[activePresId].slides.length - 1;
      }
      renderModalSlideList();
    }
  </script>
</body>
</html>
