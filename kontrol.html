<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrol Presentasi - By Buana Media</title>

  <!-- Google Font Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- File Konfigurasi Firebase External -->
  <script src="js/firebase-config.js"></script>

  <style>
    body {
      font-family: 'Poppins', 'Inter', sans-serif;
      background-color: #0b1120;
      color: #f1f5f9;
      user-select: none;
    }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex justify-center items-start">

  <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
      <h1 class="text-lg font-extrabold tracking-wider uppercase text-slate-100">Kontrol Tampilan</h1>
      <button onclick="sembunyikanOverlay()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-4 py-2.5 rounded-lg flex items-center gap-2 transition-all shadow-lg active:scale-95">
        <i class="fa-solid fa-eye-slash"></i> Sembunyikan Overlay
      </button>
    </div>

    <!-- INFORMASI PRESENTASI AKTIFF -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 mb-6">
      <h2 class="text-base font-bold text-white mb-1">Kontrol Presentasi</h2>
      <p id="info-judul" class="text-sm font-semibold text-indigo-400">Judul: <span class="text-slate-200">Minggu</span></p>
      <p id="info-pembicara" class="text-xs text-slate-400 mt-0.5">Pembicara: Pdt. John</p>
    </div>

    <!-- TARGET LAYAR -->
    <div class="mb-6">
      <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3">TAMPIL DI LAYAR:</label>
      <div class="flex flex-wrap gap-4 text-xs font-semibold text-slate-300">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="target-stream" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer"> Live Streaming
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="target-audiens" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer"> Monitor Audiens
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="target-stage" checked class="w-4 h-4 rounded accent-indigo-600 cursor-pointer"> Monitor Stage
        </label>
      </div>
    </div>

    <!-- TOMBOL KONTROL UTAMA -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
      <!-- BALIK -->
      <button onclick="prevSlide()" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold text-xs py-3 px-2 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-md">
        <i class="fa-solid fa-chevron-left"></i> Balik
      </button>

      <!-- TAMPILKAN -->
      <button onclick="tampilkanOverlay()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 px-2 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-md">
        <i class="fa-solid fa-eye"></i> Tampilkan
      </button>

      <!-- SEMBUNYIKAN -->
      <button onclick="sembunyikanOverlay()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs py-3 px-2 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-md">
        <i class="fa-solid fa-eye-slash"></i> Sembunyikan
      </button>

      <!-- BERIKUT -->
      <button onclick="nextSlide()" class="bg-indigo-700 hover:bg-indigo-600 text-white font-bold text-xs py-3 px-2 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-md">
        Berikut <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- DAFTAR SLIDE (THUMBNAIL) -->
    <div class="mb-2">
      <p class="text-xs font-semibold text-slate-400 mb-3">Daftar Slide (Klik untuk menampilkan langsung)</p>
      <div id="slide-container" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <!-- Generasi slide via Javascript -->
      </div>
    </div>

    <!-- FOOTER -->
    <div class="mt-8 pt-4 border-t border-slate-800/80 text-center text-xs text-slate-500 font-medium">
      Panel Kontrol OBS © By Buana Media
    </div>

  </div>

  <script>
    // Data Slide Presentasi
    const slidesData = [
      { id: 0, text: "Selamat Datang di Ibadah Minggu", img: "https://images.unsplash.com/photo-1510519138161-584410ef2b8e?w=500&q=80" },
      { id: 1, text: "Khotbah: Hidup Diberkati untuk Menjadi Berkat", img: "" },
      { id: 2, text: "Ayat Utama: Filipi 4:13", img: "https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=500&q=80" },
      { id: 3, text: "Pengumuman & Warta Jemaat Hari Ini", img: "" }
    ];

    let currentSlideIndex = 0;

    // Render daftar slide di UI
    function renderSlides() {
      const container = document.getElementById('slide-container');
      container.innerHTML = '';

      slidesData.forEach((slide, index) => {
        const isActive = index === currentSlideIndex;
        const card = document.createElement('div');
        card.className = `cursor-pointer rounded-xl p-3 border transition-all flex flex-col justify-between h-24 relative overflow-hidden ${
          isActive 
            ? 'bg-indigo-900/50 border-indigo-500 ring-2 ring-indigo-500/50' 
            : 'bg-slate-800/40 border-slate-700/80 hover:border-slate-500'
        }`;

        card.onclick = () => selectSlide(index);

        if (slide.img) {
          card.style.backgroundImage = `linear-gradient(to bottom, rgba(15,23,42,0.6), rgba(15,23,42,0.9)), url('${slide.img}')`;
          card.style.backgroundSize = 'cover';
          card.style.backgroundPosition = 'center';
        }

        card.innerHTML = `
          <span class="text-[10px] font-bold uppercase tracking-wider bg-slate-900/80 px-2 py-0.5 rounded text-indigo-400 w-fit">Slide ${index + 1}</span>
          <p class="text-xs font-medium text-white truncate mt-1">${slide.text}</p>
        `;

        container.appendChild(card);
      });
    }

    // Ambil Target Layar Centang
    function getSelectedTargets() {
      return {
        stream: document.getElementById('target-stream').checked,
        audiens: document.getElementById('target-audiens').checked,
        stage: document.getElementById('target-stage').checked
      };
    }

    // Mengirim Perintah & Data Ke Firebase Realtime Database
    function updateOverlayFirebase(actionType = 'show') {
      if (typeof database === 'undefined') {
        console.warn('Firebase belum terkonfigurasi pada js/firebase-config.js');
        return;
      }

      const activeSlide = slidesData[currentSlideIndex];

      database.ref('activeOverlay').set({
        action: actionType,
        type: 'presentasi',
        targets: getSelectedTargets(),
        slide: {
          text: activeSlide.text,
          img: activeSlide.img
        },
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    }

    // Fungsi Kontrol Tombol
    function selectSlide(index) {
      currentSlideIndex = index;
      renderSlides();
      tampilkanOverlay();
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlides();
        tampilkanOverlay();
      }
    }

    function nextSlide() {
      if (currentSlideIndex < slidesData.length - 1) {
        currentSlideIndex++;
        renderSlides();
        tampilkanOverlay();
      }
    }

    function tampilkanOverlay() {
      updateOverlayFirebase('show');
    }

    function sembunyikanOverlay() {
      if (typeof database !== 'undefined') {
        database.ref('activeOverlay').update({
          action: 'hide'
        });
      }
    }

    // Jalankan render awal
    renderSlides();
  </script>
</body>
</html>
