<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User - OBS Docks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-check.js"></script>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen p-5 font-sans">

  <div class="max-w-4xl mx-auto space-y-5">
    
    <!-- HEADER -->
    <div class="bg-[#111827] border border-[#1f293d] p-4 rounded-xl flex justify-between items-center shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-users-gear text-lg"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold uppercase tracking-wider">Manajemen User Operator</h1>
          <p class="text-xs text-gray-400">Tambah akun operator, atur hak akses, & reset password</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="dock.html" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 border border-gray-700">
          <i class="fa-solid fa-sliders text-indigo-400"></i> Ke Dock
        </a>
        <a href="layout.html" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center gap-1.5 border border-gray-700">
          <i class="fa-solid fa-display text-indigo-400"></i> Ke Layout
        </a>
        <button onclick="handleLogoutAdmin()" class="bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-400 text-xs px-3 py-2 rounded-lg font-semibold transition flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>

    <!-- FORM TAMBAH USER BARU -->
    <div class="bg-[#111827] border border-[#1f293d] p-5 rounded-xl space-y-4 shadow-xl">
      <h2 class="text-xs font-bold text-gray-300 uppercase tracking-wider">Registrasi User / Operator Baru</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">EMAIL OPERATOR</label>
          <input type="email" id="newUserEmail" placeholder="operator@buanamedia.id" class="w-full bg-[#0b1120] border border-[#1f293d] text-xs p-2.5 rounded-lg outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">PASSWORD</label>
          <input type="password" id="newUserPassword" placeholder="••••••••" class="w-full bg-[#0b1120] border border-[#1f293d] text-xs p-2.5 rounded-lg outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-[10px] text-gray-400 block mb-1">ROLE / HAK AKSES</label>
          <select id="newUserRole" class="w-full bg-[#0b1120] border border-[#1f293d] text-xs p-2.5 rounded-lg outline-none focus:border-indigo-500 font-semibold text-indigo-300">
            <option value="operator">Operator (Hanya Kontrol Dock)</option>
            <option value="admin">Admin (Akses Penuh + Kelola User)</option>
          </select>
        </div>
      </div>
      <button onclick="createNewUser()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2.5 rounded-lg transition shadow-lg flex items-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Buat Akun Baru
      </button>
    </div>

    <!-- DAFTAR USER -->
    <div class="bg-[#111827] border border-[#1f293d] p-5 rounded-xl space-y-3 shadow-xl">
      <h2 class="text-xs font-bold text-gray-300 uppercase tracking-wider">Daftar Pengguna Terdaftar</h2>
      <div id="userListTable" class="space-y-2.5">
        <div class="text-xs text-gray-500 italic p-2"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat daftar pengguna...</div>
      </div>
    </div>

  </div>

  <script>
    // FUNGSI LOGOUT MANDIRI KHUSUS PAGE ADMIN
    function handleLogoutAdmin() {
      if (confirm('Apakah Anda yakin ingin keluar?')) {
        sessionStorage.removeItem('obs_guest_mode');
        const authInstance = window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);
        if (authInstance) {
          authInstance.signOut().then(() => {
            window.location.href = 'login.html';
          }).catch(() => {
            window.location.href = 'login.html';
          });
        } else {
          window.location.href = 'login.html';
        }
      }
    }

    // PEMERIKSAAN USER & LOAD DAFTAR USER
    function onUserLoggedIn(user) {
      loadUserList();
    }

    function onUserGuest() {
      loadUserList();
    }

    function createNewUser() {
      const email = document.getElementById('newUserEmail').value.trim();
      const password = document.getElementById('newUserPassword').value.trim();
      const role = document.getElementById('newUserRole').value;
      const db = window.database || (typeof firebase !== 'undefined' && firebase.database ? firebase.database() : null);

      if (!email || !password) {
        alert('Email & Password wajib diisi!');
        return;
      }

      if (password.length < 6) {
        alert('Password minimal 6 karakter!');
        return;
      }

      let secondaryApp;
      try {
        secondaryApp = firebase.initializeApp(firebase.app().options, "Secondary");
      } catch (e) {
        secondaryApp = firebase.app("Secondary");
      }

      secondaryApp.auth().createUserWithEmailAndPassword(email, password)
        .then((cred) => {
          if (db) {
            db.ref('users/' + cred.user.uid).set({
              email: email,
              role: role,
              createdAt: Date.now()
            }).then(() => {
              alert('User baru berhasil didaftarkan!');
              document.getElementById('newUserEmail').value = '';
              document.getElementById('newUserPassword').value = '';
              secondaryApp.auth().signOut();
              secondaryApp.delete();
              loadUserList();
            });
          }
        })
        .catch(err => alert('Gagal membuat user: ' + err.message));
    }

    function loadUserList() {
      const db = window.database || (typeof firebase !== 'undefined' && firebase.database ? firebase.database() : null);
      const container = document.getElementById('userListTable');
      if (!db || !container) return;

      db.ref('users').on('value', (snapshot) => {
        const users = snapshot.val();
        if (!users) {
          container.innerHTML = '<p class="text-xs text-gray-500 italic">Belum ada user terdaftar.</p>';
          return;
        }

        container.innerHTML = Object.keys(users).map(uid => {
          const u = users[uid];
          const currentRole = u.role || 'operator';

          return `
            <div class="bg-[#0b1120] border border-[#1f293d] p-3 rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div>
                <div class="text-xs font-bold text-white flex items-center gap-2">
                  <i class="fa-solid fa-user-gear text-indigo-400"></i> ${u.email || 'Tanpa Email'}
                </div>
                <div class="text-[10px] text-gray-500 font-mono mt-0.5">UID: ${uid}</div>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <select onchange="updateUserRole('${uid}', this.value)" class="bg-[#111827] border border-[#1f293d] text-xs text-indigo-300 font-semibold rounded-lg px-2.5 py-1.5 outline-none focus:border-indigo-500">
                  <option value="operator" ${currentRole === 'operator' ? 'selected' : ''}>Role: Operator</option>
                  <option value="admin" ${currentRole === 'admin' ? 'selected' : ''}>Role: Admin</option>
                </select>

                <button onclick="sendUserPasswordReset('${u.email}')" class="bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/80 text-indigo-300 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                  <i class="fa-solid fa-key text-xs"></i> Reset Password
                </button>

                <button onclick="deleteUserData('${uid}', '${u.email}')" class="bg-red-950/60 hover:bg-red-900 border border-red-800/80 text-red-400 text-xs px-2.5 py-1.5 rounded-lg transition" title="Hapus User">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }, (err) => {
        console.error("Firebase read users error:", err);
        container.innerHTML = `<p class="text-xs text-red-400 italic">Gagal memuat data: ${err.message}. Periksa Firebase Security Rules Anda.</p>`;
      });
    }

    function updateUserRole(uid, newRole) {
      const db = window.database || (typeof firebase !== 'undefined' && firebase.database ? firebase.database() : null);
      if (!db) return;

      db.ref('users/' + uid).update({
        role: newRole
      }).then(() => {
        alert(`Hak akses user berhasil diubah menjadi "${newRole.toUpperCase()}".`);
      }).catch(err => {
        alert('Gagal memperbarui hak akses: ' + err.message);
      });
    }

    function sendUserPasswordReset(email) {
      if (!email) {
        alert('User tidak memiliki alamat email valid!');
        return;
      }
      if (confirm(`Kirim email tautan reset password ke "${email}"?`)) {
        const auth = window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);
        if (auth) {
          auth.sendPasswordResetEmail(email)
            .then(() => alert(`Email instruksi reset password telah dikirim ke ${email}`))
            .catch(err => alert('Gagal mengirim email reset: ' + err.message));
        }
      }
    }

    function deleteUserData(uid, email) {
      if (confirm(`Hapus data pendaftaran user "${email}" dari database?`)) {
        const db = window.database || (typeof firebase !== 'undefined' && firebase.database ? firebase.database() : null);
        if (db) {
          db.ref('users/' + uid).remove()
            .then(() => alert('Data user berhasil dihapus dari Realtime Database.'))
            .catch(err => alert('Gagal menghapus: ' + err.message));
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadUserList();
    });
  </script>
</body>
</html>
