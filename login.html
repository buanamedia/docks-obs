<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Operator - Buana Media Control Panel</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            panelBg: '#090d16',
            cardBg: '#111827',
            cardBorder: '#1f293d',
            inputBg: '#0b1120'
          },
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Font Inter & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- External Configurations & Auth Check -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-check.js"></script>

  <style>
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    .modal-backdrop {
      background-color: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

  <div class="flex-1 flex items-center justify-center">
    <div class="w-full max-w-md bg-cardBg border border-cardBorder rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
      
      <!-- LOGO & BRANDING -->
      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto shadow-lg">
          <i class="fa-solid fa-sliders text-2xl"></i>
        </div>
        <h1 class="text-lg font-extrabold text-white tracking-wider uppercase">OBS Control Panel</h1>
        <p class="text-xs text-gray-400">Masuk untuk mengontrol Tampilan Overlay OBS & Multi-Display</p>
      </div>

      <!-- NOTIFIKASI ERROR/PESAN -->
      <div id="loginAlert" class="hidden bg-red-950/80 border border-red-800 text-red-300 text-xs p-3 rounded-xl flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
        <span id="loginAlertText">Email atau password salah!</span>
      </div>

      <!-- FORM LOGIN -->
      <form onsubmit="submitStandaloneLogin(event)" class="space-y-4">
        <div>
          <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">Email Operator</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
            <input type="email" id="pageEmail" required placeholder="admin@buanamedia.id" class="w-full bg-inputBg border border-cardBorder text-xs text-white pl-9 pr-3 py-3 rounded-xl outline-none focus:border-indigo-500 transition">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Password</label>
            <!-- TOMBOL LUPA PASSWORD -->
            <button type="button" onclick="openResetPasswordModal()" class="text-[11px] text-indigo-400 hover:text-indigo-300 transition">Lupa Password?</button>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
            <input type="password" id="pagePassword" required placeholder="••••••••" class="w-full bg-inputBg border border-cardBorder text-xs text-white pl-9 pr-10 py-3 rounded-xl outline-none focus:border-indigo-500 transition">
            
            <!-- IKON MATA TOGGLE PASSWORD -->
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition focus:outline-none">
              <i id="togglePasswordIcon" class="fa-solid fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <div class="pt-2 space-y-2">
          <button type="submit" id="btnSubmitLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
          </button>
          
          <button type="button" onclick="continueAsGuestMode()" class="w-full bg-gray-800/80 hover:bg-gray-800 text-gray-300 font-semibold text-xs py-2.5 rounded-xl transition border border-gray-700/60">
            Masuk Mode Tamu (Lihat-Lihat Saja)
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- MODAL RESET PASSWORD -->
  <div id="resetPasswordModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
    <div class="bg-cardBg border border-cardBorder w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-cardBorder pb-3">
        <h3 class="text-sm font-bold text-white uppercase"><i class="fa-solid fa-key text-indigo-400 mr-2"></i>Reset Password</h3>
        <button onclick="closeResetPasswordModal()" class="text-gray-400 hover:text-white text-xs font-bold">✕</button>
      </div>
      
      <p class="text-xs text-gray-300 leading-relaxed">
        Masukkan email akun Anda. Kami akan mengirimkan instruksi dan tautan untuk mereset password ke email tersebut.
      </p>

      <div id="resetAlert" class="hidden text-xs p-3 rounded-xl flex items-center gap-2">
        <i id="resetAlertIcon" class="fa-solid text-sm shrink-0"></i>
        <span id="resetAlertText"></span>
      </div>

      <div>
        <label class="text-[10px] font-bold text-gray-400 block mb-1">EMAIL TERDAFTAR</label>
        <input type="email" id="resetEmailInput" placeholder="admin@buanamedia.id" class="w-full bg-inputBg border border-cardBorder text-xs text-white p-2.5 rounded-lg outline-none focus:border-indigo-500">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeResetPasswordModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold rounded-lg transition">Batal</button>
        <button onclick="handleSendPasswordReset()" id="btnSendReset" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition shadow-md">
          Kirim Email
        </button>
      </div>
    </div>
  </div>

  <footer class="text-center text-[11px] text-gray-500 font-medium py-2">
    Panel Kontrol OBS &copy; By <a href="https://www.buanamedia.my.id/" target="_blank" class="hover:underline hover:text-blue-500 transition-colors">Buana Media</a>
  </footer>

  <script>
    // 1. TOGGLE MATA LIHAT PASSWORD
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('pagePassword');
      const toggleIcon = document.getElementById('togglePasswordIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // 2. BUKA / TUTUP MODAL RESET PASSWORD
    function openResetPasswordModal() {
      const emailVal = document.getElementById('pageEmail').value.trim();
      if (emailVal) {
        document.getElementById('resetEmailInput').value = emailVal;
      }
      document.getElementById('resetAlert').classList.add('hidden');
      document.getElementById('resetPasswordModal').classList.remove('hidden');
    }

    function closeResetPasswordModal() {
      document.getElementById('resetPasswordModal').classList.add('hidden');
    }

    // 3. PROSES KIRIM EMAIL RESET PASSWORD VIA FIREBASE
    function handleSendPasswordReset() {
      const email = document.getElementById('resetEmailInput').value.trim();
      const alertBox = document.getElementById('resetAlert');
      const alertText = document.getElementById('resetAlertText');
      const alertIcon = document.getElementById('resetAlertIcon');
      const btn = document.getElementById('btnSendReset');

      if (!email) {
        alertBox.className = 'bg-red-950/80 border border-red-800 text-red-300 text-xs p-3 rounded-xl flex items-center gap-2';
        alertIcon.className = 'fa-solid fa-circle-exclamation text-sm shrink-0';
        alertText.innerText = 'Harap isi alamat email Anda!';
        alertBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Mengirim...';

      const authInstance = window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);

      if (authInstance) {
        authInstance.sendPasswordResetEmail(email)
          .then(() => {
            btn.disabled = false;
            btn.innerText = 'Kirim Email';
            alertBox.className = 'bg-emerald-950/80 border border-emerald-800 text-emerald-300 text-xs p-3 rounded-xl flex items-center gap-2';
            alertIcon.className = 'fa-solid fa-circle-check text-sm shrink-0';
            alertText.innerText = 'Email reset password telah dikirim! Periksa kotak masuk/spam email Anda.';
            alertBox.classList.remove('hidden');
          })
          .catch((err) => {
            btn.disabled = false;
            btn.innerText = 'Kirim Email';
            alertBox.className = 'bg-red-950/80 border border-red-800 text-red-300 text-xs p-3 rounded-xl flex items-center gap-2';
            alertIcon.className = 'fa-solid fa-circle-exclamation text-sm shrink-0';
            
            let message = 'Gagal mengirim email reset password.';
            if (err.code === 'auth/user-not-found') {
              message = 'Email tidak terdaftar di sistem!';
            } else if (err.code === 'auth/invalid-email') {
              message = 'Format email tidak valid!';
            }
            alertText.innerText = message;
            alertBox.classList.remove('hidden');
          });
      }
    }

    // 4. AUTENTIKASI UTAMA
    function onUserLoggedIn(user) {
      if (user && !user.isAnonymous) {
        window.location.href = 'dock.html';
      }
    }

    function submitStandaloneLogin(e) {
      e.preventDefault();
      const email = document.getElementById('pageEmail').value.trim();
      const password = document.getElementById('pagePassword').value;
      const alertBox = document.getElementById('loginAlert');
      const alertText = document.getElementById('loginAlertText');
      const btn = document.getElementById('btnSubmitLogin');

      if (!email || !password) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';
      alertBox.classList.add('hidden');

      const authInstance = window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);

      if (authInstance) {
        authInstance.signInWithEmailAndPassword(email, password)
          .then(() => {
            sessionStorage.removeItem('obs_guest_mode');
            window.location.href = 'dock.html';
          })
          .catch((err) => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
            
            let message = 'Login gagal. Periksa email & password Anda.';
            if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
              message = 'Email atau password salah!';
            } else if (err.code === 'auth/invalid-email') {
              message = 'Format email tidak valid.';
            } else if (err.code === 'auth/too-many-requests') {
              message = 'Terlalu banyak percobaan. Coba beberapa saat lagi.';
            }
            
            alertText.innerText = message;
            alertBox.classList.remove('hidden');
          });
      } else {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang';
        alertText.innerText = 'Firebase Auth belum siap. Periksa file js/firebase-config.js Anda.';
        alertBox.classList.remove('hidden');
      }
    }

    function continueAsGuestMode() {
      sessionStorage.setItem('obs_guest_mode', 'true');
      const authInstance = window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);
      
      if (authInstance) {
        authInstance.signInAnonymously()
          .then(() => { window.location.href = 'dock.html'; })
          .catch(() => { window.location.href = 'dock.html'; });
      } else {
        window.location.href = 'dock.html';
      }
    }
  </script>
</body>
</html>
